# Render Blueprint — wordplay-backend (FastAPI + yt-search-python)
# https://render.com/docs/infrastructure-as-code
#
# Install ffmpeg on the host if you need transcoding (not included in default Python env).

services:
  - type: web
    name: wordplay-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
